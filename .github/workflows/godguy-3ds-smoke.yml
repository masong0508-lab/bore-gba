name: GodGuy 3DS cinematic regression smoke
on:
  push:
    paths:
      - 'godguy/3ds/**'
      - 'godguy/source/terrain_palette.h'
      - 'godguy/pc_explore3d.c'
      - 'godguy/pc_title_globe.c'
      - 'godguy/source/main.c'
      - 'godguy/pc_3ds_*.c'
      - '.github/workflows/godguy-3ds-smoke.yml'
  pull_request:
    paths:
      - 'godguy/3ds/**'
      - 'godguy/source/terrain_palette.h'
      - 'godguy/pc_explore3d.c'
      - 'godguy/pc_title_globe.c'
      - 'godguy/source/main.c'
      - 'godguy/pc_3ds_*.c'
      - '.github/workflows/godguy-3ds-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: godguy-3ds-smoke-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  sdk-free:
    name: C11 cinematic geometry and acting
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify restored spherical title and planet view on DS, DSi and New3DS
        working-directory: godguy
        shell: bash
        run: |
          set -euo pipefail
          for target in ds dsi16 new3ds; do
            flags="-DNDSSHIM -DGG_PORTABLE_GLOBE_TEST -DNDSHW"
            case "$target" in
              dsi16) flags="$flags -DGG_DSI16";;
              new3ds) flags="-DNDSSHIM -DGG_PORTABLE_GLOBE_TEST -D__3DS__ -DGG_HQVOX";;
            esac
            gcc -O1 -g -std=c11 -w -fsanitize=undefined,bounds -fno-sanitize-recover=all \
              $flags -Icompat -Isource -include unistd.h \
              pc_title_globe.c -lm -o "/tmp/gg-title-$target"
            "/tmp/gg-title-$target"
          done
      - name: Build and run bounded camera, actor and material regressions
        working-directory: godguy
        shell: bash
        run: |
          set -euo pipefail
          for test in walkin camera acting type staging framing projection architecture direction actor_visual floor partner occlusion anatomy scenery facade life mesh mesh_material procedural_people person_motion new3ds sky; do
            printf '\n-- 3DS %s --\n' "$test"
            gcc -O2 -std=c11 -Wall -Wextra -Werror "pc_3ds_${test}.c" -o "/tmp/gg-3ds-${test}"
            "/tmp/gg-3ds-${test}"
          done
      - name: Run real-world mesh and gameplay-coherence integration checks
        working-directory: godguy
        shell: bash
        run: |
          set -euo pipefail
          gcc -O2 -std=c11 -Wall -Wextra -Werror pc_3ds_gpu_batch.c -o /tmp/gg-pica-batch
          /tmp/gg-pica-batch
          gcc -O2 -std=c11 -DGG_NEW3DS_ONLY -w -Icompat -Isource pc_3ds_mesh_world.c -lm -o /tmp/gg-3ds-worldmesh
          /tmp/gg-3ds-worldmesh
          gcc -O1 -g -std=c11 -DGG_NEW3DS_ONLY -fsanitize=undefined,bounds -fno-sanitize-recover=all -w -Icompat -Isource pc_3ds_mesh_world.c -lm -o /tmp/gg-3ds-worldmesh-safe
          /tmp/gg-3ds-worldmesh-safe
          gcc -O1 -g -std=c11 -DGG_NEW3DS_ONLY -fsanitize=undefined,bounds -fno-sanitize-recover=all -w -Icompat -Isource pc_3ds_interaction.c -lm -o /tmp/gg-3ds-interaction
          /tmp/gg-3ds-interaction
          for test in world_art inhabitants; do
            gcc -O1 -g -std=c11 -DGG_NEW3DS_ONLY -fsanitize=undefined,bounds -fno-sanitize-recover=all -w -Icompat -Isource "pc_3ds_${test}.c" -lm -o "/tmp/gg-3ds-${test}"
            "/tmp/gg-3ds-${test}"
          done
          gcc -O1 -g -std=c11 -DGG_NEW3DS_ONLY -fsanitize=undefined,bounds -fno-sanitize-recover=all -Wall -Wextra -Werror pc_3ds_sky.c -o /tmp/gg-3ds-sky-safe
          /tmp/gg-3ds-sky-safe
      - name: Render 400x240 story, character turntables and occlusion comparisons
        working-directory: godguy
        shell: bash
        run: |
          set -euo pipefail
          gcc -O2 -std=c11 -DGG_NEW3DS_ONLY -w -Icompat -Isource pc_3ds_cinema_capture.c -lm -o /tmp/gg-3ds-capture
          mkdir -p artifacts/godguy-cinema
          /tmp/gg-3ds-capture artifacts/godguy-cinema
          gcc -O1 -g -std=c11 -DGG_NEW3DS_ONLY -fsanitize=undefined,bounds -fno-sanitize-recover=all -w -Icompat -Isource pc_3ds_art_tour.c -lm -o /tmp/gg-3ds-art-tour
          /tmp/gg-3ds-art-tour artifacts/godguy-cinema
          /tmp/gg-3ds-procedural_people artifacts/godguy-cinema/procedural_people_turntable.ppm
          python3 tools/film_capture_png.py artifacts/godguy-cinema
          if command -v ffmpeg >/dev/null; then
            ffmpeg -hide_banner -loglevel error -y -framerate 6 -start_number 0 \
              -i artifacts/godguy-cinema/frame_%02d.ppm -c:v libx264 \
              -preset veryfast -crf 19 -pix_fmt yuv420p \
              artifacts/godguy-cinema/3ds_source_reel.mp4
            ffmpeg -hide_banner -loglevel error -y -framerate 6 -start_number 0 \
              -i artifacts/godguy-cinema/pov_%02d.ppm -c:v libx264 \
              -preset veryfast -crf 19 -pix_fmt yuv420p \
              artifacts/godguy-cinema/3ds_playable_pov.mp4
            ffmpeg -hide_banner -loglevel error -y -framerate 2 -start_number 0 \
              -i artifacts/godguy-cinema/scenery_%02d.ppm -c:v libx264 \
              -preset veryfast -crf 19 -pix_fmt yuv420p \
              artifacts/godguy-cinema/3ds_biome_showcase.mp4
            ffmpeg -hide_banner -loglevel error -y -framerate 2 -start_number 0 \
              -i artifacts/godguy-cinema/mesh_env_%02d.ppm -c:v libx264 \
              -preset veryfast -crf 19 -pix_fmt yuv420p \
              artifacts/godguy-cinema/3ds_true_polygon_world.mp4
            ffmpeg -hide_banner -loglevel error -y -framerate 6 -start_number 0 \
              -i artifacts/godguy-cinema/mesh_walk_%02d.ppm -c:v libx264 \
              -preset veryfast -crf 19 -pix_fmt yuv420p \
              artifacts/godguy-cinema/3ds_true_polygon_camera.mp4
            ffmpeg -hide_banner -loglevel error -y -framerate 4 -start_number 0 \
              -i artifacts/godguy-cinema/mesh_citizens_%02d.ppm -c:v libx264 \
              -preset veryfast -crf 19 -pix_fmt yuv420p \
              artifacts/godguy-cinema/3ds_polygonal_living_citizens.mp4
          fi
      - name: Publish native source captures and measured host frame costs
        uses: actions/upload-artifact@v4
        with:
          name: godguy-3ds-native-captures
          path: |
            godguy/artifacts/godguy-cinema/*.png
            godguy/artifacts/godguy-cinema/*.mp4
            godguy/artifacts/godguy-cinema/*.csv
          if-no-files-found: error
