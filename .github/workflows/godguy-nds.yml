# GODGUY DS ROMS v1  - builds the Nintendo DS ROMs of godguy/ with devkitARM. Separate from build.yml (the GBA game), so neither slows the other.
name: Build GodGuy DS ROMs
on:
  push:
    paths:
      - 'godguy/**'
      - '.github/workflows/godguy-nds.yml'
  workflow_dispatch:
permissions:
  contents: write
# only the newest push of a branch may publish, so an old slow run can never overwrite a newer ROM
concurrency:
  group: godguy-nds-${{ github.ref }}
  cancel-in-progress: true
jobs:
  nds:
    runs-on: ubuntu-latest
    container: mirror.gcr.io/devkitpro/devkitarm:latest
    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITARM: /opt/devkitpro/devkitARM
    steps:
      - uses: actions/checkout@v4
      - name: Validate hardware ROM shell scripts
        working-directory: godguy
        run: bash -n build_hw.sh build_dsi.sh build_rom.sh
      - name: Tools (python3, make, ndstool, libnds + calico)
        run: |
          command -v python3 >/dev/null || { apt-get update && apt-get install -y python3; }
          [ -x /usr/bin/python3 ] || ln -sf "$(command -v python3)" /usr/bin/python3     # (the build scripts call /usr/bin/python3)
          # The immutable devkitARM container already ships DS/3DS SDKs.
          # Package mirrors sometimes reject ALL database requests with 403.
          # Verify the complete installed SDK first; only attempt network
          # synchronization if required bits are actually missing. Both
          # native 3DS builds publish their installed package versions and
          # still MUST produce byte-identical executables before release.
          if test -x "$DEVKITARM/bin/arm-none-eabi-gcc" &&
             test -x "$DEVKITPRO/tools/bin/ndstool" &&
             test -d "$DEVKITPRO/calico" &&
             test -f "$DEVKITPRO/libnds/include/nds.h" &&
             test -f "$DEVKITPRO/libctru/lib/libctru.a"; then
            echo "Verified complete container-provided console SDK (offline)"
          else
            for attempt in 1 2 3 4; do
              if dkp-pacman -Syu --noconfirm &&
                 dkp-pacman -S --needed --noconfirm nds-dev ndstool 3ds-dev; then
                break
              fi
              if [ "$attempt" -eq 4 ]; then
                echo "Missing required SDK and package mirrors unavailable" >&2
                exit 1
              fi
              sleep $((attempt * 5))
            done
          fi
          dkp-pacman -Q devkitarm-gcc devkitarm-newlib libnds calico ndstool libctru
          ls "$DEVKITPRO/tools/bin/ndstool" "$DEVKITPRO/calico" 2>&1 | head -5

      - name: Verify animated spherical UI and restored DS planet mode across port layouts
        working-directory: godguy
        run: |
          set -e
          for target in ds dsi16 new3ds; do
            flags="-DNDSSHIM -DGG_PORTABLE_GLOBE_TEST"
            case "$target" in
              dsi16) flags="$flags -DGG_DSI16";;
              new3ds) flags="$flags -D__3DS__";;
            esac
            gcc -O1 -g -std=c11 -w -fsanitize=undefined,bounds -fno-sanitize-recover=all \
              $flags -Icompat -Isource -include unistd.h \
              pc_title_globe.c -lm -o "/tmp/gg-title-$target"
            "/tmp/gg-title-$target"
          done

      - name: Regenerate professionally mastered vocal chops and 168-track sequences
        working-directory: godguy
        run: |
          /usr/bin/python3 -c 'import numpy,scipy,mido' 2>/dev/null || { apt-get update && apt-get install -y python3-numpy python3-scipy python3-mido; }
          /usr/bin/python3 tools/gm2_compose.py
          /usr/bin/python3 tools/gm_vox.py
          /usr/bin/python3 tools/check_vocal_banks.py
          gcc -O2 -std=c11 -Wall -Wextra -Werror pc_save_stream.c -o /tmp/gg-ds-save-stream
          /tmp/gg-ds-save-stream
          gcc -O2 -std=c11 -DNDSHW -Icompat -Isource pc_vocal_priority.c -lm -o /tmp/gg-vocal-priority
          /tmp/gg-vocal-priority
          GM_FULL=1 /usr/bin/python3 tools/gm_vox.py
          GM_HQ=1 /usr/bin/python3 tools/gm_vox.py
          test -s source/gmdata.h
          test -s source/gmvox.h
          test -s source/gmvox_full.h
          test -s source/gmvox_hq.h
          test -s source/gmvox_hq.bin
          test -s source/gmvox_hi.bin
          test -s source/gmvox_compact.h
      # Generate the source-backed shared film rather than shipping the
      # previously checked-in 4-key cels. The builder rejects any shared
      # film over the fixed 192 KiB DS asset cap.
      - name: Regenerate DS and DSi movie plates and six-pose actor art
        working-directory: godguy
        run: |
          /usr/bin/python3 -c "from PIL import Image" 2>/dev/null || { apt-get update && apt-get install -y python3-pil; }
          /usr/bin/python3 tools/make_story_fmv.py
          grep -q 'FILM_CEL_N = 6' source/story_fmv_data.h
          test -s source/story_fmv_data.h
      # 3DS gets fourteen detailed 40x48 acting keys. The DS and DSi
      # retain native 28x34 cels, with speech/listen now included.
      - name: Generate 3DS high-detail animated character cels
        working-directory: godguy
        run: |
          /usr/bin/python3 tools/make_story_hq.py
          test -s source/story_film_hq_data.h

      - name: Verify save recovery and cartridge capacity before building ROMs
        working-directory: godguy
        run: |
          for layout in DS DSI BIG; do
            flags=""
            if [ "$layout" = DSI ]; then flags="-DGG_DSI16"; fi
            if [ "$layout" = BIG ]; then flags="-DGG_BIG"; fi
            gcc -O1 -DNDSSHIM $flags -fsanitize=bounds -fno-sanitize-recover=bounds -Icompat -Isource -Wno-all -include unistd.h pc_save_safety.c -lm -o /tmp/gg-save-safety
            /tmp/gg-save-safety
          done
          gcc -O2 -w -Isource pc_save_hw_guard.c -lm -o /tmp/gg-save-hw-guard
          /tmp/gg-save-hw-guard

      - name: Verify world generation and connected Riven March terrain
        working-directory: godguy
        run: |
          for cfg in ds dsi16 big; do
            flags=""
            case "$cfg" in dsi16) flags="-DGG_DSI16";; big) flags="-DGG_BIG";; esac
            gcc -O2 $flags -Icompat -Isource -w pc_gen.c -lm -o "/tmp/gg-gen-$cfg"
            "/tmp/gg-gen-$cfg"
          done

      # Film runtime and script sanity checks are fast and SDK-independent.
      # Prevent release packaging if story beats, titles, unlocks, or
      # captions drift below the 80+40 minute 3DS director's-cut contract.
      - name: Verify 80-minute 3DS campaign and 40-minute unlockable film archive
        working-directory: godguy
        run: /usr/bin/python3 tools/check_story_duration.py

      # 1. Main DS target: no libnds/Calico. Real-ROM startup, gameplay,
      # audio and cartridge save/reload tested in DeSmuME; each flashcart
      # and other emulator still needs its own runtime check.
      - name: godguy_hw.nds  (DraStic / melonDS / hardware, no libnds)
        working-directory: godguy
        run: |
          chmod +x build_hw.sh build_rom.sh build_dsi.sh
          ./build_hw.sh
          /usr/bin/python3 tools/check_nds_vocal_image.py godguy_hw.nds
          mkdir -p ../out && cp godguy_hw.nds ../out/godguy_hw.nds

      # 2. Optional libnds/Calico SD-save experiment. DeSmuME currently
      # reaches white screens; other loaders remain unverified. Package
      # separately from the recommended direct-hardware DS candidate.
      - name: godguy.nds  (libnds + calico, SD saves)
        continue-on-error: true
        working-directory: godguy
        run: |
          ./build_rom.sh
          cp godguy.nds ../out/godguy.nds

      # 3. The DS-mode DSi build is an important DraStic fallback, so a
      # missing one is a *hard failure*, not a green build with no ROM.
      - name: godguy_dsi.nds and godguy_dsi_mode.nds
        working-directory: godguy
        run: |
          ./build_dsi.sh
          /usr/bin/python3 tools/check_nds_vocal_image.py godguy_dsi.nds
          cp godguy_dsi.nds godguy_dsi_mode.nds ../out/

      # 4. Keep the confirmed diagnostic recovery build available even
      # if an experimental audio or save-device configuration fails.
      - name: godguy_hw_safe.nds (no audio, no saving)
        working-directory: godguy
        run: |
          GG_FLAGS=-DGG_SAFE ./build_hw.sh
          cp godguy_hw.nds ../out/godguy_hw_safe.nds

      # 5. Targeted recovery ROMs: isolate the two startup subsystems
      # disabled by GG_SAFE; never overwrite the normal published ROM.
      - name: godguy_hw_audio_only.nds (music, no cartridge saves)
        working-directory: godguy
        run: |
          GG_FLAGS=-DGG_NO_CART_SAVE ./build_hw.sh
          cp godguy_hw.nds ../out/godguy_hw_audio_only.nds

      - name: godguy_hw_save_only.nds (saves, no audio)
        working-directory: godguy
        run: |
          GG_FLAGS=-DGG_NO_AUDIO ./build_hw.sh
          cp godguy_hw.nds ../out/godguy_hw_save_only.nds

      - name: godguy_hw_nocache.nds (diagnostic)
        continue-on-error: true
        working-directory: godguy
        run: |
          GG_NOCACHE=" " ./build_hw.sh
          cp godguy_hw.nds ../out/godguy_hw_nocache.nds

      # 6. the Nintendo 3DS homebrew build (libctru): godguy.3dsx
      - name: godguy.3dsx  (3DS, libctru)
        working-directory: godguy
        run: |
          # The same immutable image supplies the 3DS SDK. Only access
          # remote package indices if libctru/PICA tooling is missing.
          if ! test -s "$DEVKITPRO/libctru/lib/libctru.a" ||
             ! test -s "$DEVKITPRO/libctru/lib/libcitro3d.a" ||
             ! test -x "$DEVKITPRO/tools/bin/3dsxtool" ||
             ! test -x "$DEVKITPRO/tools/bin/picasso"; then
            dkp-pacman -S --needed --noconfirm 3ds-dev
          fi
          export DEVKITPRO=/opt/devkitpro
          chmod +x 3ds/build.sh
          echo "MIXED-PORT New3DS source and compiler provenance"
          "$DEVKITARM/bin/arm-none-eabi-gcc" --version | head -1
          dkp-pacman -Q devkitarm-gcc devkitarm-newlib libctru
          sha256sum "$DEVKITPRO/libctru/lib/libctru.a"
          sha256sum source/gmdata.h source/gmvox_hq.h source/story_film_hq_data.h
          ./3ds/build.sh
          sha256sum godguy.3dsx
          mkdir -p ../out && cp godguy.3dsx ../out/godguy.3dsx

      # Exact pixel/VRAM regression for zoomed terrain, partial updates and
      # forced repaints across layouts, including platform-specific zoom limits.
      # This test must pass before uploading or publishing ROMs.
      - name: Verify zoom renderer (DS, DSi16, large-map and 3DS layouts)
        working-directory: godguy
        run: |
          command -v gcc >/dev/null || { apt-get update && apt-get install -y gcc; }
          for cfg in ds dsi16 big 3ds; do
            flags=""
            case "$cfg" in dsi16) flags="-DGG_DSI16";; big) flags="-DGG_BIG";; 3ds) flags="-D__3DS__ -DGG_BIG";; esac
            gcc -O2 -DNDSSHIM -DGG_ZOOM_TEST $flags -Icompat -Isource -Wno-all -include unistd.h pc_zoom_perf.c -lm -o "/tmp/godguy-zoom-$cfg"
            "/tmp/godguy-zoom-$cfg"
            gcc -O1 -DNDSSHIM $flags -fsanitize=bounds -fno-sanitize-recover=bounds -Icompat -Isource -Wno-all -include unistd.h pc_map_art.c -lm -o "/tmp/godguy-map-art-$cfg"
            mkdir -p "artifacts/map-art-$cfg"
            "/tmp/godguy-map-art-$cfg" "artifacts/map-art-$cfg"
          done

      # 3DS-only globe renderer is more detailed than the DS fallback.
      # Confirm real ARM11/libctru builds above, then compare picking,
      # visual palette, pixel detail, tile uploads and scene music against
      # regression references on the host. These tests are required.
      - name: Verify native graphics, facade depth and inhabitants
        working-directory: godguy
        shell: bash
        run: |
          set -euo pipefail
          gcc -O2 -std=c11 -Wall -Wextra -Werror pc_3ds_sky.c -o /tmp/gg-visual-sky
          /tmp/gg-visual-sky
          gcc -O2 -std=c11 -Wall -Wextra -Werror pc_3ds_procedural_people.c -o /tmp/gg-visual-people
          /tmp/gg-visual-people
          for test in world_art inhabitants; do
            gcc -O1 -g -std=c11 -DGG_NEW3DS_ONLY -fsanitize=undefined,bounds -fno-sanitize-recover=all -w -Icompat -Isource "pc_3ds_${test}.c" -lm -o "/tmp/gg-visual-${test}"
            "/tmp/gg-visual-${test}"
          done

      - name: Validate 3DS globe graphics and simulation audio detection
        working-directory: godguy
        run: |
          command -v gcc >/dev/null || { apt-get update && apt-get install -y gcc; }
          gcc -O2 -DNDSSHIM -D__3DS__ -DGG_GLOBE_TEST -Icompat -Isource -Wno-all -include unistd.h pc_globe3ds.c -lm -o /tmp/godguy-globe3ds
          /tmp/godguy-globe3ds
          gcc -O2 -DNDSSHIM -Icompat -Isource -Wno-all -include unistd.h pc_music_fast.c -lm -o /tmp/godguy-music-fast
          /tmp/godguy-music-fast
          gcc -O2 -DNDSSHIM -DGG_BIG -Icompat -Isource -Wno-all -include unistd.h pc_music_fast.c -lm -o /tmp/godguy-music-big
          /tmp/godguy-music-big

      # Deterministic 3DS wall-clock recovery and quality-governor test,
      # followed by an active-music population/weather/rotation workload.
      # Unlike build-only checks, these run the real globe rasterizer and
      # full software audio mixer with 720 simulation ticks per profile.
      - name: Stress 3DS globe with populated coast, live music and timing stalls
        working-directory: godguy
        run: |
          gcc -O2 -Wall -Wextra pc_3ds_clock.c -o /tmp/godguy-clock-3ds
          /tmp/godguy-clock-3ds
          gcc -O2 -DNDSSHIM -D__3DS__ -DSHIM_HQ -DGG_HQVOX -Icompat -Isource -Wno-all -include unistd.h pc_globe_audio_load.c -lm -o /tmp/godguy-globe-audio-load
          /tmp/godguy-globe-audio-load

      - name: Verify the GodGuy starter kit, field tools and world laws
        working-directory: godguy
        run: |
          for cfg in ds dsi16 3ds; do
            flags=""
            case "$cfg" in dsi16) flags="-DGG_DSI16";; 3ds) flags="-D__3DS__";; esac
            gcc -O2 -DNDSSHIM $flags -Icompat -Isource -w -include unistd.h pc_field.c -lm -o "/tmp/godguy-field-$cfg"
            scratch=$(mktemp -d)
            (cd "$scratch" && "/tmp/godguy-field-$cfg")
          done
          gcc -O2 -DNDSSHIM -Icompat -Isource -w -include unistd.h pc_lawmenu.c -lm -o /tmp/godguy-lawmenu
          /tmp/godguy-lawmenu

      # SDK-free 3DS perspective regression: exercises real scene geometry
      # before the complete cinematic playback and ROM packaging checks.
      - name: Verify 3DS world-space film geometry and animated sets
        working-directory: godguy
        run: |
          gcc -O2 -std=c11 -D__3DS__ -Wall -Wextra -Icompat -Isource pc_world3d.c -o /tmp/godguy-world3d
          /tmp/godguy-world3d

      - name: Verify chapter-film playback and sound timing
        working-directory: godguy
        run: |
          for cfg in ds dsi16 3ds; do
            flags=""
            case "$cfg" in dsi16) flags="-DGG_DSI16";; 3ds) flags="-D__3DS__";; esac
            gcc -O2 -DNDSSHIM $flags -Icompat -Isource -w -include unistd.h pc_fmv.c -lm -o "/tmp/godguy-fmv-$cfg"
            "/tmp/godguy-fmv-$cfg"
          done

      - name: Export authentic three-chapter 3DS cinematic reel
        working-directory: godguy
        run: |
          command -v ffmpeg >/dev/null || { apt-get update && apt-get install -y ffmpeg; }
          gcc -O2 -DNDSSHIM -D__3DS__ -DSHIM_HQ -DGG_HQVOX -Icompat -Isource -w -include unistd.h pc_fmv_reel.c -lm -o /tmp/godguy-fmv-reel
          /tmp/godguy-fmv-reel ../out/first_three_chapters.rgb ../out/first_three_chapters.pcm
          ffmpeg -hide_banner -loglevel error -y -f rawvideo -pixel_format rgb24 -video_size 256x192 -framerate 20 \
            -i ../out/first_three_chapters.rgb -f s16le -ar 32768 -ac 2 -i ../out/first_three_chapters.pcm \
            -vf 'scale=768:576:flags=neighbor' \
            -af 'afade=t=in:st=0:d=0.35,afade=t=out:st=59.3:d=0.7' \
            -c:v libx264 -crf 18 -preset veryfast -pix_fmt yuv420p -c:a aac -b:a 160k \
            -movflags +faststart -shortest ../out/godguy_first_three_chapters.mp4
          ffmpeg -hide_banner -loglevel error -y -f rawvideo -pixel_format rgb24 -video_size 256x192 -framerate 20 \
            -i ../out/first_three_chapters.rgb -an -vf 'fps=10,scale=384:288:flags=neighbor' \
            -loop 0 ../out/godguy_first_three_chapters.gif
          rm ../out/first_three_chapters.rgb ../out/first_three_chapters.pcm
          test -s ../out/godguy_first_three_chapters.mp4
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of csv=p=0 ../out/godguy_first_three_chapters.mp4 | grep -q aac
          test -s ../out/godguy_first_three_chapters.gif

      - name: Profile gameplay frame and simulation-tick budgets
        working-directory: godguy
        run: |
          GG_STRESS_FRAMES=300 ./tools/bench_frame.sh

      - name: What was built
        if: always()
        run: |
          { echo "### GodGuy DS ROMs"; echo '```'; ls -la out 2>&1; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          for rom in godguy_hw.nds godguy_dsi.nds godguy_hw_safe.nds godguy_hw_audio_only.nds godguy_hw_save_only.nds godguy.3dsx godguy_first_three_chapters.mp4 godguy_first_three_chapters.gif; do test -s "out/$rom" || exit 1; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: godguy-nds
          path: |
            out/*.nds
            out/*.3dsx
            out/*.mp4
            out/*.gif
            out/*.mp4
            out/*.gif
          if-no-files-found: error
  # Runs independently of the DS ARM9 link and lets the 3DS film reveal
  # its own compile/runtime regressions instead of being hidden by the first
  # console's failure. The complete mixed-port release remains gated above.
  cinema3ds:
    name: 3DS feature film — SDK build and host playback
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container: mirror.gcr.io/devkitpro/devkitarm:latest
    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITARM: /opt/devkitpro/devkitARM
    steps:
      - uses: actions/checkout@v4
      - name: SDK, tools and film cels
        working-directory: godguy
        run: |
          # Build with the exact same container-provided SDK as the mixed
          # console job. Updating only one SDK job introduces binary drift.
          # The final release gate compares both compiled 3DSX bytes and
          # rejects different versions, rather than trusting version names.
          if test -x "$DEVKITARM/bin/arm-none-eabi-gcc" &&
             test -s "$DEVKITPRO/libctru/lib/libctru.a" &&
             test -s "$DEVKITPRO/libctru/lib/libcitro3d.a" &&
             test -x "$DEVKITPRO/tools/bin/3dsxtool" &&
             test -x "$DEVKITPRO/tools/bin/picasso"; then
            echo "Verified complete container-provided New3DS SDK (offline)"
          else
            for attempt in 1 2 3 4; do
              if dkp-pacman -Syu --noconfirm &&
                 dkp-pacman -S --needed --noconfirm 3ds-dev; then
                break
              fi
              if [ "$attempt" -eq 4 ]; then
                echo "Missing New3DS SDK and package mirrors unavailable" >&2
                exit 1
              fi
              sleep $((attempt * 5))
            done
          fi
          command -v gcc >/dev/null || { apt-get update && apt-get install -y gcc; }
          /usr/bin/python3 -c 'from PIL import Image' 2>/dev/null || { apt-get update && apt-get install -y python3-pil; }
          /usr/bin/python3 -c 'import numpy,scipy,mido' 2>/dev/null || { apt-get update && apt-get install -y python3-numpy python3-scipy python3-mido; }
          /usr/bin/python3 tools/gm2_compose.py
          GM_HQ=1 /usr/bin/python3 tools/gm_vox.py
          /usr/bin/python3 tools/gm_vox.py
          /usr/bin/python3 tools/check_vocal_banks.py
          test -s source/gmvox_hq.h
          /usr/bin/python3 tools/check_story_duration.py
          /usr/bin/python3 tools/make_story_fmv.py
          /usr/bin/python3 tools/make_story_hq.py
          grep -q 'FILM_CEL_N = 6' source/story_fmv_data.h
      - name: Verify terrain-safe 3DS cinematic walk-ins and dialogue continuity
        working-directory: godguy
        run: |
          gcc -O2 -std=c11 -Wall -Wextra -Werror pc_3ds_walkin.c -o /tmp/gg-3ds-walkin
          /tmp/gg-3ds-walkin
          gcc -O2 -std=c11 -Wall -Wextra -Werror pc_3ds_camera.c -o /tmp/gg-3ds-camera
          /tmp/gg-3ds-camera
          gcc -O2 -std=c11 -Wall -Wextra -Werror pc_3ds_acting.c -o /tmp/gg-3ds-acting
          /tmp/gg-3ds-acting
          gcc -O2 -std=c11 -Wall -Wextra -Werror pc_3ds_type.c -o /tmp/gg-3ds-type
          /tmp/gg-3ds-type
          gcc -O2 -std=c11 -Wall -Wextra -Werror pc_3ds_staging.c -o /tmp/gg-3ds-staging
          /tmp/gg-3ds-staging
          gcc -O2 -std=c11 -Wall -Wextra -Werror pc_3ds_framing.c -o /tmp/gg-3ds-framing
          /tmp/gg-3ds-framing
          gcc -O2 -std=c11 -Wall -Wextra -Werror pc_3ds_projection.c -o /tmp/gg-3ds-projection
          /tmp/gg-3ds-projection
          gcc -O2 -std=c11 -Wall -Wextra -Werror pc_3ds_architecture.c -o /tmp/gg-3ds-architecture
          /tmp/gg-3ds-architecture
          gcc -O2 -std=c11 -Wall -Wextra -Werror pc_3ds_facade.c -o /tmp/gg-3ds-facade
          /tmp/gg-3ds-facade
          gcc -O2 -std=c11 -Wall -Wextra -Werror pc_3ds_life.c -o /tmp/gg-3ds-life
          /tmp/gg-3ds-life
          gcc -O2 -std=c11 -Wall -Wextra -Werror pc_3ds_direction.c -o /tmp/gg-3ds-direction
          /tmp/gg-3ds-direction
          gcc -O2 -std=c11 -Wall -Wextra -Werror pc_3ds_actor_visual.c -o /tmp/gg-3ds-actor-visual
          /tmp/gg-3ds-actor-visual
          gcc -O2 -std=c11 -Wall -Wextra -Werror pc_3ds_floor.c -o /tmp/gg-3ds-floor
          /tmp/gg-3ds-floor
          gcc -O2 -std=c11 -Wall -Wextra -Werror pc_3ds_partner.c -o /tmp/gg-3ds-partner
          /tmp/gg-3ds-partner
      - name: Verify 3DS frame copies, stereo and audio lifecycle
        working-directory: godguy
        run: |
          gcc -O2 -std=c11 -Wall -Wextra -Werror -Wno-misleading-indentation -Wno-unused-function -I3ds/stub pc_3ds.c 3ds/platform3ds.c -lm -o /tmp/gg-3ds-platform
          /tmp/gg-3ds-platform
      - name: Build native 3DS homebrew executable
        working-directory: godguy
        run: |
          chmod +x 3ds/build.sh
          echo "CINEMA New3DS source and compiler provenance"
          "$DEVKITARM/bin/arm-none-eabi-gcc" --version | head -1
          dkp-pacman -Q devkitarm-gcc devkitarm-newlib libctru
          sha256sum "$DEVKITPRO/libctru/lib/libctru.a"
          sha256sum source/gmdata.h source/gmvox_hq.h source/story_film_hq_data.h
          GG_BUILD_GPU_PROBE=1 ./3ds/build.sh
          sha256sum godguy.3dsx
          test -s godguy.3dsx
          test -s godguy_new3ds_gpu_probe.3dsx
      - name: Verify crisp top/bottom 3DS cinema scaling and UI restore
        working-directory: godguy
        run: |
          gcc -O2 -DNDSSHIM -D__3DS__ -Icompat -Isource -w pc_cinema_display3ds.c -lm -o /tmp/gg-3ds-film-screen
          /tmp/gg-3ds-film-screen
      - name: Verify playable 3DS block-world controls, safe edits and memory
        working-directory: godguy
        run: |
          gcc -O2 -std=c11 -Wall -Wextra -Icompat -Isource pc_explore3d.c -lm -o /tmp/gg-3ds-explore
          /tmp/gg-3ds-explore
      - name: Export nine source-rendered 3DS alternative ending films
        working-directory: godguy
        run: |
          command -v ffmpeg >/dev/null || { apt-get update && apt-get install -y ffmpeg; }
          gcc -O2 -std=c11 -w -Icompat -Isource pc_reign_reel.c -lm -o /tmp/gg-3ds-reign-reel
          mkdir -p ../out
          /tmp/gg-3ds-reign-reel ../out/reign_endings.rgb
          ffmpeg -hide_banner -loglevel error -y -f rawvideo -pixel_format rgb24 \
            -video_size 400x240 -framerate 24 -i ../out/reign_endings.rgb \
            -vf 'scale=800:480:flags=neighbor' -an -c:v libx264 -crf 20 \
            -preset veryfast -pix_fmt yuv420p -movflags +faststart \
            ../out/godguy_unwritten_reign_endings.mp4
          rm ../out/reign_endings.rgb
          test -s ../out/godguy_unwritten_reign_endings.mp4
      - name: Verify adaptive 3DS score, themed music and smooth scene switches
        working-directory: godguy
        run: |
          gcc -O2 -std=c11 -w -Icompat -Isource pc_world_music3d.c -lm -o /tmp/gg-world-score
          /tmp/gg-world-score
      - name: Render 3DS remastered vocal-mix listening previews
        working-directory: godguy
        run: |
          gcc -O2 -DGG_HQVOX -Icompat -Isource pc_music.c -lm -o /tmp/godguy-vocal-preview
          mkdir -p ../out
          /tmp/godguy-vocal-preview 82 ../out/Corporations_3DS_vocal_preview.wav 22
          /tmp/godguy-vocal-preview 83 ../out/Duck_and_Cover_3DS_vocal_preview.wav 22
          test -s ../out/Corporations_3DS_vocal_preview.wav
          test -s ../out/Duck_and_Cover_3DS_vocal_preview.wav
      - name: Host-test 3DS cast and world geometry
        working-directory: godguy
        run: |
          gcc -O2 -std=c11 -D__3DS__ -Wall -Wextra -Icompat -Isource pc_world3d.c -o /tmp/gg-3ds-world
          /tmp/gg-3ds-world
          gcc -O2 -DNDSSHIM -D__3DS__ -DSHIM_HQ -DGG_HQVOX -ffunction-sections -fdata-sections -Icompat -Isource -w -include unistd.h pc_origin_render.c -Wl,--gc-sections -lm -o /tmp/gg-3ds-origin
          /tmp/gg-3ds-origin
          gcc -O2 -DNDSSHIM -D__3DS__ -DSHIM_HQ -DGG_HQVOX -ffunction-sections -fdata-sections -Icompat -Isource -w -include unistd.h pc_outdoor3d.c -Wl,--gc-sections -lm -o /tmp/gg-3ds-outdoor
          /tmp/gg-3ds-outdoor
          gcc -O1 -DNDSSHIM -D__3DS__ -DSHIM_HQ -DGG_HQVOX -ffunction-sections -fdata-sections -Icompat -Isource -w -include unistd.h pc_3ds_chronicle_checkpoint.c -Wl,--gc-sections -lm -o /tmp/gg-3ds-checkpoint
          /tmp/gg-3ds-checkpoint
          gcc -O2 -DNDSSHIM -D__3DS__ -DSHIM_HQ -DGG_HQVOX -Icompat -Isource -w -include unistd.h pc_fmv.c -lm -o /tmp/gg-3ds-cinema
          /tmp/gg-3ds-cinema
      - name: Upload independent 3DS ROM for inspection
        uses: actions/upload-artifact@v4
        with:
          name: godguy-3ds-cinema
          path: |
            godguy/godguy.3dsx
            godguy/godguy_new3ds_gpu_probe.3dsx
            out/godguy_unwritten_reign_endings.mp4
            out/Corporations_3DS_vocal_preview.wav
            out/Duck_and_Cover_3DS_vocal_preview.wav
          if-no-files-found: error

  # Release-candidate artifacts are produced only after BOTH console
  # builder jobs pass. Source-only regressions cannot greenlight a
  # mislabelled DSi image or a missing New3DS/GPU homebrew executable.
  # The ZIPs explicitly distinguish playable candidates from diagnostics.
  port-candidates:
    name: Verify ROM headers and package GodGuy port candidates
    needs: [nds, cinema3ds]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fetch complete DS/DSi and independent New 3DS artifacts
        uses: actions/download-artifact@v4
        with:
          name: godguy-nds
          path: port_images/nds
      - name: Fetch GPU probe and 3DS source-build artifact
        uses: actions/download-artifact@v4
        with:
          name: godguy-3ds-cinema
          path: port_images/cinema
      - name: Prove that corrupt and mislabeled ROMs fail release checks
        run: python3 godguy/tools/test_package_port_candidates.py
      - name: Require reproducible New 3DS game images from both SDK jobs
        run: |
          python3 - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          images = []
          for root in ('port_images/nds', 'port_images/cinema'):
              matches = list(Path(root).rglob('godguy.3dsx'))
              if len(matches) != 1:
                  raise SystemExit(f'{root}: expected one playable New 3DS image, found {len(matches)}')
              image = matches[0].read_bytes()
              print(f'{sha256(image).hexdigest()}  {matches[0]} ({len(image)} bytes)')
              images.append(image)
          if images[0] != images[1]:
              raise SystemExit('New 3DS SDK jobs produced different game images; compare SDK and asset provenance before publishing')
          print('Both independent New 3DS builds are byte-identical.')
          PY
      - name: Validate real headers and emit compact verified candidate ZIPs
        run: |
          python3 godguy/tools/package_port_candidates.py \
            --artifact-dir port_images/nds \
            --artifact-dir port_images/cinema \
            --output port_release \
            --commit "${{ github.sha }}"
          test -s port_release/PORTS_MANIFEST.json
          test "$(find port_release -name '*.zip' | wc -l)" -eq 2
          ls -lh port_release/
      - name: Upload two clearly labeled, checksummed port candidate ZIPs
        uses: actions/upload-artifact@v4
        with:
          name: godguy-multiport-release-candidates
          path: port_release/
          if-no-files-found: error
      # Publishing now depends on ALL port images and their header/CRC
      # inspection; a passing DS compile alone is never a release gate.
      # Manual console/emulator QA still must precede a stable release.
      - name: Publish CI-qualified GodGuy candidate bundles
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          # A reused tag can keep pointing at an old commit while its
          # release accumulates newer ROMs. Each candidate gets its own
          # source-addressed tag and assets instead.
          tag_name: godguy-ports-ci-${{ github.sha }}
          name: GodGuy DS/DSi/New3DS — CI candidates ${{ github.sha }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          body: |
            Automatically built candidate images after BOTH DS/DSi and
            New 3DS SDK jobs passed and ROM headers/CRC, DSi mode flags,
            SHA-256 hashes and ZIP integrity checks succeeded.
            These are NOT hardware-tested or a stable release.
            New 3DS software-rendered game requires New-series hardware.
            The PICA200 executable is an INDEPENDENT GPU prototype.
            The unsigned 16 MiB DSi-mode build is experimental.
            See PORTS_MANIFEST.json and PORT_RELEASE_QA.md for exact
            source hashes and manual acceptance gates.
          files: |
            port_release/*.zip
            port_release/PORTS_MANIFEST.json
