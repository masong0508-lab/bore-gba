# GODGUY DS ROMS v1  - builds the Nintendo DS ROMs of godguy/ with devkitARM. Separate from build.yml (the GBA game), so neither slows the other.
name: Build GodGuy DS ROMs
on:
  push:
    paths:
      - 'godguy/**'
      - '.github/workflows/godguy-nds.yml'
  workflow_dispatch:
permissions:
  contents: write
# only the newest push of a branch may publish, so an old slow run can never overwrite a newer ROM
concurrency:
  group: godguy-nds-${{ github.ref }}
  cancel-in-progress: true
jobs:
  nds:
    runs-on: ubuntu-latest
    container: mirror.gcr.io/devkitpro/devkitarm:latest
    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITARM: /opt/devkitpro/devkitARM
    steps:
      - uses: actions/checkout@v4
      - name: Tools (python3, make, ndstool, libnds + calico)
        run: |
          command -v python3 >/dev/null || { apt-get update && apt-get install -y python3; }
          [ -x /usr/bin/python3 ] || ln -sf "$(command -v python3)" /usr/bin/python3     # (the build scripts call /usr/bin/python3)
          dkp-pacman -Syu --noconfirm || true
          dkp-pacman -S --needed --noconfirm nds-dev ndstool || true
          ls "$DEVKITPRO/tools/bin/ndstool" "$DEVKITPRO/calico" 2>&1 | head -5

      # Generate the source-backed shared film rather than shipping the
      # previously checked-in 4-key cels. The builder rejects any shared
      # film over the fixed 192 KiB DS asset cap.
      - name: Regenerate DS and DSi movie plates and six-pose actor art
        working-directory: godguy
        run: |
          /usr/bin/python3 -c "from PIL import Image" 2>/dev/null || { apt-get update && apt-get install -y python3-pil; }
          /usr/bin/python3 tools/make_story_fmv.py
          grep -q 'FILM_CEL_N = 6' source/story_fmv_data.h
          test -s source/story_fmv_data.h
      # 3DS gets fourteen detailed 40x48 acting keys. The DS and DSi
      # retain native 28x34 cels, with speech/listen now included.
      - name: Generate 3DS high-detail animated character cels
        working-directory: godguy
        run: |
          /usr/bin/python3 tools/make_story_hq.py
          test -s source/story_film_hq_data.h

      # Film runtime and script sanity checks are fast and SDK-independent.
      # Prevent release packaging if story beats, titles, unlocks, or
      # captions drift below the 80+40 minute 3DS director's-cut contract.
      - name: Verify 80-minute 3DS campaign and 40-minute unlockable film archive
        working-directory: godguy
        run: /usr/bin/python3 tools/check_story_duration.py

      - name: Verify player-world cinematic vistas on DS and 3DS
        working-directory: godguy
        run: |
          gcc -O2 -std=c11 -Wall -Wextra -Icompat -Isource pc_vistas.c -o /tmp/godguy-vistas
          /tmp/godguy-vistas

      # 1. the main one: no libnds, no calico. Runs in DraStic and melonDS. No SD saving (it saves to the cartridge chip, or use DraStic save states).
      - name: godguy_hw.nds  (DraStic / melonDS / hardware, no libnds)
        working-directory: godguy
        run: |
          chmod +x build_hw.sh build_rom.sh build_dsi.sh
          ./build_hw.sh
          mkdir -p ../out && cp godguy_hw.nds ../out/godguy_hw.nds

      # 2. the libnds 2 / calico build: SD saving, three save slots, globe. For melonDS and flashcarts.
      - name: godguy.nds  (libnds + calico, SD saves)
        continue-on-error: true
        working-directory: godguy
        run: |
          ./build_rom.sh
          cp godguy.nds ../out/godguy.nds

      # 3. The DS-mode DSi build is an important DraStic fallback, so a
      # missing one is a *hard failure*, not a green build with no ROM.
      - name: godguy_dsi.nds and godguy_dsi_mode.nds
        working-directory: godguy
        run: |
          ./build_dsi.sh
          cp godguy_dsi.nds godguy_dsi_mode.nds ../out/

      # 4. Keep the confirmed diagnostic recovery build available even
      # if an experimental audio or save-device configuration fails.
      - name: godguy_hw_safe.nds (no audio, no saving)
        working-directory: godguy
        run: |
          GG_FLAGS=-DGG_SAFE ./build_hw.sh
          cp godguy_hw.nds ../out/godguy_hw_safe.nds

      # 5. Targeted recovery ROMs: isolate the two startup subsystems
      # disabled by GG_SAFE; never overwrite the normal published ROM.
      - name: godguy_hw_audio_only.nds (music, no cartridge saves)
        working-directory: godguy
        run: |
          GG_FLAGS=-DGG_NO_CART_SAVE ./build_hw.sh
          cp godguy_hw.nds ../out/godguy_hw_audio_only.nds

      - name: godguy_hw_save_only.nds (saves, no audio)
        working-directory: godguy
        run: |
          GG_FLAGS=-DGG_NO_AUDIO ./build_hw.sh
          cp godguy_hw.nds ../out/godguy_hw_save_only.nds

      - name: godguy_hw_nocache.nds (diagnostic)
        continue-on-error: true
        working-directory: godguy
        run: |
          GG_NOCACHE=" " ./build_hw.sh
          cp godguy_hw.nds ../out/godguy_hw_nocache.nds

      # 6. the Nintendo 3DS homebrew build (libctru): godguy.3dsx
      - name: godguy.3dsx  (3DS, libctru)
        working-directory: godguy
        run: |
          dkp-pacman -S --needed --noconfirm 3ds-dev || true
          export DEVKITPRO=/opt/devkitpro
          chmod +x 3ds/build.sh
          ./3ds/build.sh
          mkdir -p ../out && cp godguy.3dsx ../out/godguy.3dsx

      # Exact pixel/VRAM regression for zoomed terrain, partial updates and
      # forced repaints in all three coordinate/creature-memory layouts.
      # This test must pass before uploading or publishing ROMs.
      - name: Verify zoom renderer (DS, DSi16 and 3DS layouts)
        working-directory: godguy
        run: |
          command -v gcc >/dev/null || { apt-get update && apt-get install -y gcc; }
          for cfg in ds dsi16 big; do
            flags=""
            case "$cfg" in dsi16) flags="-DGG_DSI16";; big) flags="-DGG_BIG";; esac
            gcc -O2 -DNDSSHIM -DGG_ZOOM_TEST $flags -Icompat -Isource -Wno-all -include unistd.h pc_zoom_perf.c -lm -o "/tmp/godguy-zoom-$cfg"
            "/tmp/godguy-zoom-$cfg"
          done

      # 3DS-only globe renderer is more detailed than the DS fallback.
      # Confirm real ARM11/libctru builds above, then compare picking,
      # visual palette, pixel detail, tile uploads and scene music against
      # regression references on the host. These tests are required.
      - name: Validate 3DS globe graphics and simulation audio detection
        working-directory: godguy
        run: |
          command -v gcc >/dev/null || { apt-get update && apt-get install -y gcc; }
          gcc -O2 -DNDSSHIM -D__3DS__ -DGG_GLOBE_TEST -Icompat -Isource -Wno-all -include unistd.h pc_globe3ds.c -lm -o /tmp/godguy-globe3ds
          /tmp/godguy-globe3ds
          gcc -O2 -DNDSSHIM -Icompat -Isource -Wno-all -include unistd.h pc_music_fast.c -lm -o /tmp/godguy-music-fast
          /tmp/godguy-music-fast
          gcc -O2 -DNDSSHIM -DGG_BIG -Icompat -Isource -Wno-all -include unistd.h pc_music_fast.c -lm -o /tmp/godguy-music-big
          /tmp/godguy-music-big

      # Deterministic 3DS wall-clock recovery and quality-governor test,
      # followed by an active-music population/weather/rotation workload.
      # Unlike build-only checks, these run the real globe rasterizer and
      # full software audio mixer with 720 simulation ticks per profile.
      - name: Stress 3DS globe with populated coast, live music and timing stalls
        working-directory: godguy
        run: |
          gcc -O2 -Wall -Wextra pc_3ds_clock.c -o /tmp/godguy-clock-3ds
          /tmp/godguy-clock-3ds
          gcc -O2 -DNDSSHIM -D__3DS__ -DSHIM_HQ -DGG_HQVOX -Icompat -Isource -Wno-all -include unistd.h pc_globe_audio_load.c -lm -o /tmp/godguy-globe-audio-load
          /tmp/godguy-globe-audio-load

      - name: Verify the GodGuy starter kit, field tools and world laws
        working-directory: godguy
        run: |
          for cfg in ds dsi16 3ds; do
            flags=""
            case "$cfg" in dsi16) flags="-DGG_DSI16";; 3ds) flags="-D__3DS__";; esac
            gcc -O2 -DNDSSHIM $flags -Icompat -Isource -w -include unistd.h pc_field.c -lm -o "/tmp/godguy-field-$cfg"
            scratch=$(mktemp -d)
            (cd "$scratch" && "/tmp/godguy-field-$cfg")
          done
          gcc -O2 -DNDSSHIM -Icompat -Isource -w -include unistd.h pc_lawmenu.c -lm -o /tmp/godguy-lawmenu
          /tmp/godguy-lawmenu

      # SDK-free 3DS perspective regression: exercises real scene geometry
      # before the complete cinematic playback and ROM packaging checks.
      - name: Verify 3DS world-space film geometry and animated sets
        working-directory: godguy
        run: |
          gcc -O2 -std=c11 -D__3DS__ -Wall -Wextra -Icompat -Isource pc_world3d.c -o /tmp/godguy-world3d
          /tmp/godguy-world3d

      - name: Verify chapter-film playback and sound timing
        working-directory: godguy
        run: |
          for cfg in ds 3ds; do
            flags=""
            if [ "$cfg" = 3ds ]; then flags="-D__3DS__"; fi
            gcc -O2 -DNDSSHIM $flags -Icompat -Isource -w -include unistd.h pc_fmv.c -lm -o "/tmp/godguy-fmv-$cfg"
            "/tmp/godguy-fmv-$cfg"
          done

      - name: Export authentic three-chapter 3DS cinematic reel
        working-directory: godguy
        run: |
          command -v ffmpeg >/dev/null || { apt-get update && apt-get install -y ffmpeg; }
          gcc -O2 -DNDSSHIM -D__3DS__ -DSHIM_HQ -DGG_HQVOX -Icompat -Isource -w -include unistd.h pc_fmv_reel.c -lm -o /tmp/godguy-fmv-reel
          /tmp/godguy-fmv-reel ../out/first_three_chapters.rgb ../out/first_three_chapters.pcm
          ffmpeg -hide_banner -loglevel error -y -f rawvideo -pixel_format rgb24 -video_size 256x192 -framerate 20 \
            -i ../out/first_three_chapters.rgb -f s16le -ar 32768 -ac 2 -i ../out/first_three_chapters.pcm \
            -vf 'scale=768:576:flags=neighbor' \
            -af 'afade=t=in:st=0:d=0.35,afade=t=out:st=59.3:d=0.7' \
            -c:v libx264 -crf 18 -preset veryfast -pix_fmt yuv420p -c:a aac -b:a 160k \
            -movflags +faststart -shortest ../out/godguy_first_three_chapters.mp4
          ffmpeg -hide_banner -loglevel error -y -f rawvideo -pixel_format rgb24 -video_size 256x192 -framerate 20 \
            -i ../out/first_three_chapters.rgb -an -vf 'fps=10,scale=384:288:flags=neighbor' \
            -loop 0 ../out/godguy_first_three_chapters.gif
          rm ../out/first_three_chapters.rgb ../out/first_three_chapters.pcm
          test -s ../out/godguy_first_three_chapters.mp4
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of csv=p=0 ../out/godguy_first_three_chapters.mp4 | grep -q aac
          test -s ../out/godguy_first_three_chapters.gif

      - name: Profile gameplay frame and simulation-tick budgets
        working-directory: godguy
        run: |
          GG_STRESS_FRAMES=300 ./tools/bench_frame.sh

      - name: What was built
        if: always()
        run: |
          { echo "### GodGuy DS ROMs"; echo '```'; ls -la out 2>&1; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          for rom in godguy_hw.nds godguy_dsi.nds godguy_hw_safe.nds godguy_hw_audio_only.nds godguy_hw_save_only.nds godguy.3dsx godguy_first_three_chapters.mp4 godguy_first_three_chapters.gif; do test -s "out/$rom" || exit 1; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: godguy-nds
          path: |
            out/*.nds
            out/*.3dsx
            out/*.mp4
            out/*.gif
            out/*.mp4
            out/*.gif
          if-no-files-found: error
      - name: Publish as the "GodGuy DS (latest)" release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: godguy-latest
          name: GodGuy DS (latest) - ${{ github.sha }}
          body: "New GodGuy DS build from main, commit ${{ github.sha }}. Start with godguy_hw.nds or godguy_dsi.nds (DS-mode). If DraStic fails: godguy_hw_audio_only.nds has music but skips cartridge save initialization (use emulator save states), godguy_hw_save_only.nds has saves but no sound, and godguy_hw_safe.nds has neither. godguy_dsi_mode.nds needs real DSi-mode support (not DraStic). godguy.nds is the experimental libnds/calico build. Green CI verifies builds, NOT emulator startup."
          target_commitish: ${{ github.sha }}
          make_latest: false
          files: |
            out/*.nds
            out/*.3dsx

  # Runs independently of the DS ARM9 link and lets the 3DS film reveal
  # its own compile/runtime regressions instead of being hidden by the first
  # console's failure. The complete mixed-port release remains gated above.
  cinema3ds:
    name: 3DS feature film — SDK build and host playback
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container: mirror.gcr.io/devkitpro/devkitarm:latest
    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITARM: /opt/devkitpro/devkitARM
    steps:
      - uses: actions/checkout@v4
      - name: SDK, tools and film cels
        working-directory: godguy
        run: |
          dkp-pacman -S --needed --noconfirm 3ds-dev
          command -v gcc >/dev/null || { apt-get update && apt-get install -y gcc; }
          /usr/bin/python3 -c 'from PIL import Image' 2>/dev/null || { apt-get update && apt-get install -y python3-pil; }
          /usr/bin/python3 tools/check_story_duration.py
          /usr/bin/python3 tools/make_story_fmv.py
          /usr/bin/python3 tools/make_story_hq.py
          grep -q 'FILM_CEL_N = 6' source/story_fmv_data.h
      - name: Build native 3DS homebrew executable
        working-directory: godguy
        run: |
          chmod +x 3ds/build.sh
          ./3ds/build.sh
          test -s godguy.3dsx
      - name: Verify crisp top/bottom 3DS cinema scaling and UI restore
        working-directory: godguy
        run: |
          gcc -O2 -DNDSSHIM -D__3DS__ -Icompat -Isource -w pc_cinema_display3ds.c -lm -o /tmp/gg-3ds-film-screen
          /tmp/gg-3ds-film-screen
      - name: Verify playable 3DS block-world controls, safe edits and memory
        working-directory: godguy
        run: |
          gcc -O2 -std=c11 -Wall -Wextra -Icompat -Isource pc_explore3d.c -lm -o /tmp/gg-3ds-explore
          /tmp/gg-3ds-explore
      - name: Export nine source-rendered 3DS alternative ending films
        working-directory: godguy
        run: |
          command -v ffmpeg >/dev/null || { apt-get update && apt-get install -y ffmpeg; }
          gcc -O2 -std=c11 -w -Icompat -Isource pc_reign_reel.c -lm -o /tmp/gg-3ds-reign-reel
          mkdir -p ../out
          /tmp/gg-3ds-reign-reel ../out/reign_endings.rgb
          ffmpeg -hide_banner -loglevel error -y -f rawvideo -pixel_format rgb24 \
            -video_size 400x240 -framerate 24 -i ../out/reign_endings.rgb \
            -vf 'scale=800:480:flags=neighbor' -an -c:v libx264 -crf 20 \
            -preset veryfast -pix_fmt yuv420p -movflags +faststart \
            ../out/godguy_unwritten_reign_endings.mp4
          rm ../out/reign_endings.rgb
          test -s ../out/godguy_unwritten_reign_endings.mp4
      - name: Verify adaptive 3DS score, themed music and smooth scene switches
        working-directory: godguy
        run: |
          gcc -O2 -std=c11 -w -Icompat -Isource pc_world_music3d.c -lm -o /tmp/gg-world-score
          /tmp/gg-world-score
      - name: Host-test saved-world coastline and settlement capture
        working-directory: godguy
        run: |
          gcc -O2 -std=c11 -Wall -Wextra -Icompat -Isource pc_vistas.c -o /tmp/gg-3ds-vistas
          /tmp/gg-3ds-vistas
      - name: Host-test 3DS cast and world geometry
        working-directory: godguy
        run: |
          gcc -O2 -std=c11 -D__3DS__ -Wall -Wextra -Icompat -Isource pc_world3d.c -o /tmp/gg-3ds-world
          /tmp/gg-3ds-world
          gcc -O2 -DNDSSHIM -D__3DS__ -DSHIM_HQ -DGG_HQVOX -Icompat -Isource -w -include unistd.h pc_fmv.c -lm -o /tmp/gg-3ds-cinema
          /tmp/gg-3ds-cinema
      - name: Upload independent 3DS ROM for inspection
        uses: actions/upload-artifact@v4
        with:
          name: godguy-3ds-cinema
          path: |
            godguy/godguy.3dsx
            out/godguy_unwritten_reign_endings.mp4
          if-no-files-found: error
