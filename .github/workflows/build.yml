name: Build GBA ROM
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
# Only the newest push of a branch may publish: an older, slower run can no longer finish last and overwrite "Latest build" with an old ROM.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4
      - name: Check HERE TODAY is the full song
        run: |
          # source/music/here_today.adp starts with a u32 sample count (18157 Hz). The full song is 152 s = about 2,761,000 samples.
          n=$(od -An -tu4 -N4 source/music/here_today.adp | tr -d ' ')
          n=$((n & 1073741823))
          secs=$((n / 18157))
          echo "HERE TODAY: $n samples = $secs s"
          { echo "### HERE TODAY (Missy's song)"; echo "$secs s in the ROM (full song = 152 s), built from commit ${GITHUB_SHA}"; } >> "$GITHUB_STEP_SUMMARY"
          if [ "$secs" -lt 150 ]; then echo "ERROR: here_today.adp is only $secs s long, the full song is 152 s"; exit 1; fi
      - name: Build
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=/opt/devkitpro/devkitARM
          export PATH=$DEVKITARM/bin:$DEVKITPRO/tools/bin:$PATH
          make
          make size
      - uses: actions/upload-artifact@v4
        with:
          name: bore-gba
          path: bore.gba
      - name: Publish the latest build of main as the "Latest build" release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build (${{ github.sha }})
          body: The newest bore.gba built from main, commit ${{ github.sha }}. Download bore.gba below and open it in mGBA, Pizza Boy, a PSP emulator or a flash cart.
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: bore.gba
      - name: Publish release on tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: bore.gba
