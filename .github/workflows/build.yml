name: Build GBA ROM
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
# Only the newest push of a branch may publish: an older, slower run can no longer finish last and overwrite "Latest build" with an old ROM.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    container: mirror.gcr.io/devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4
      - name: Check HERE TODAY is the full song
        run: |
          # source/music/here_today.adp starts with a u32 sample count (18157 Hz). The full song is 152 s = about 2,761,000 samples.
          n=$(od -An -tu4 -N4 source/music/here_today.adp | tr -d ' ')
          n=$((n & 1073741823))
          secs=$((n / 18157))
          echo "HERE TODAY: $n samples = $secs s"
          { echo "### HERE TODAY (Missy's song)"; echo "$secs s in the ROM (full song = 152 s), built from commit ${GITHUB_SHA}"; } >> "$GITHUB_STEP_SUMMARY"
          if [ "$secs" -lt 150 ]; then echo "ERROR: here_today.adp is only $secs s long, the full song is 152 s"; exit 1; fi
      - name: Build
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=/opt/devkitpro/devkitARM
          export PATH=$DEVKITARM/bin:$DEVKITPRO/tools/bin:$PATH
          command -v python3 >/dev/null || { apt-get update && apt-get install -y python3; }   # (tools/make_packs.py lays out and patches the expansion packs)
          make
          make size
          make creator
      - name: Biggest users and ROM headroom
        run: |
          export PATH=/opt/devkitpro/devkitARM/bin:$PATH
          first=$(awk '/XP_AT0/{gsub("u","",$3); print $3}' source/packslots.h)
          python3 - "$first" <<'PYX' >> "$GITHUB_STEP_SUMMARY"
          import re, subprocess, sys, os
          first = int(sys.argv[1], 16)
          def run(*a): return subprocess.run(a, capture_output=True, text=True).stdout
          nm = run("arm-none-eabi-nm", "-S", "--size-sort", "-r", "bore.elf").splitlines()
          def top(prefix, n):
              out = []
              for l in nm:
                  p = l.split()
                  if len(p) >= 4 and re.match(prefix, p[0]): out.append("%8d  %s" % (int(p[1], 16), p[3]))
                  if len(out) >= n: break
              return "\n".join(out)
          end = 0
          for l in run("arm-none-eabi-objdump", "-h", "bore.elf").splitlines():
              m = re.match(r"\s*\d+\s+\S+\s+([0-9a-f]+)\s+([0-9a-f]+)\s+([0-9a-f]+)\s", l)
              if m:
                  size, lma = int(m.group(1), 16), int(m.group(3), 16)
                  if 0x08000000 <= lma < first and size: end = max(end, lma + size)
          lim = first - 0x08000000; used = end - 0x08000000
          print("### ROM headroom")
          print("Base game: %d of %d bytes (%.1f%%), **%d bytes free** before the first pack slot." % (used, lim, used * 100.0 / lim, lim - used))
          print("bore.gba %d B, bore-base.gba %d B, bore-creator.gba %d B" % (os.path.getsize("bore.gba"), os.path.getsize("bore-base.gba"), os.path.getsize("bore-creator.gba")))
          for title, pre, n in (("Top EWRAM statics", r"02", 30), ("Top IWRAM statics", r"03", 20), ("Top ROM symbols", r"0[89]", 30)):
              print("### " + title); print("```"); print(top(pre, n)); print("```")
          PYX
      - uses: actions/upload-artifact@v4
        with:
          name: bore-gba
          path: |
            bore.gba
            bore-base.gba
            packs/*.bps
      - uses: actions/upload-artifact@v4
        with:
          name: bore-creator-demo
          path: bore-creator.gba
      - name: Publish the latest build of main as the "Latest build" release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build (${{ github.sha }})
          body: The newest build from main, commit ${{ github.sha }}. bore.gba is the whole game with every expansion pack in - play that one. bore-base.gba is the base game alone, and the BORE-EP*.bps files are the expansion packs one by one; patch them onto bore-base.gba in any order, alone or together (Flips, Rom Patcher JS, ...). Open the ROM in mGBA, Pizza Boy, a PSP emulator or a flash cart.
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: |
            bore.gba
            bore-base.gba
            bore-creator.gba
            packs/*.bps
      - name: Publish release on tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bore.gba
            bore-base.gba
            packs/*.bps
