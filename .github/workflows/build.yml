name: Build GBA ROM
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=/opt/devkitpro/devkitARM
          export PATH=$DEVKITARM/bin:$DEVKITPRO/tools/bin:$PATH
          make
          make size
      - uses: actions/upload-artifact@v4
        with:
          name: bore-gba
          path: bore.gba
      - name: Publish the latest build of main as the "Latest build" release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          body: The newest bore.gba built from main. Download bore.gba below and open it in mGBA, Pizza Boy, a PSP emulator or a flash cart.
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: bore.gba
      - name: Publish release on tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: bore.gba
