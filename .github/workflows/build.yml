name: Build GBA ROM
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
# Only the newest push of a branch may publish: an older, slower run can no longer finish last and overwrite "Latest build" with an old ROM.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    container: mirror.gcr.io/devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4
      - name: Check HERE TODAY is the full song
        run: |
          command -v python3 >/dev/null || { apt-get update && apt-get install -y python3; }
          python3 tools/check_here_today.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Missy story and cinema regression
        run: |
          if ! command -v cc >/dev/null 2>&1; then apt-get update && apt-get install -y gcc; fi
          cc -std=c11 -O2 -Wall -Wextra -Werror tools/test_missyrules.c -o /tmp/bore-missyrules
          /tmp/bore-missyrules
          python3 tools/test_missy_story.py
          python3 tools/test_missy_handover.py
          python3 tools/test_missy_campaign.py
          python3 tools/test_personality_save.py
          python3 tools/test_cslighting.py
          bash tools/render_cutscene.sh --check-patient
      - name: Skate feel host regression
        run: |
          if ! command -v cc >/dev/null 2>&1; then apt-get update && apt-get install -y gcc; fi
          cc -std=c11 -O2 -Wall -Wextra -Wno-unused-function tools/test_skatefeel.c -o /tmp/bore-skatefeel
          /tmp/bore-skatefeel
          cc -std=c11 -O2 -Wall -Wextra -Werror tools/test_skatejam.c -o /tmp/bore-skatejam
          /tmp/bore-skatejam
          cc -std=c11 -O2 -Wall -Wextra -Werror tools/test_npcspots.c -o /tmp/bore-npcspots
          /tmp/bore-npcspots
      - name: Build
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=/opt/devkitpro/devkitARM
          export PATH=$DEVKITARM/bin:$DEVKITPRO/tools/bin:$PATH
          command -v python3 >/dev/null || { apt-get update && apt-get install -y python3; }   # (tools/make_packs.py lays out and patches the expansion packs)
          make
          make size
          make creator
      - name: Build Missy hospital cinematic preview
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=/opt/devkitpro/devkitARM
          export PATH=$DEVKITARM/bin:$DEVKITPRO/tools/bin:$PATH
          make preview-missy CS_PREVIEW_SCENE=4
          test -s bore-missy-preview.gba
          python3 - <<'PY'
          from pathlib import Path
          rom=Path("bore-missy-preview.gba").read_bytes()
          assert rom[0xA0:0xA9]==b"MISSYWARD"
          print(f"Missy hospital preview ROM: PASS ({len(rom)} bytes)")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: bore-missy-hospital-preview
          path: bore-missy-preview.gba
      - name: Build Missy's first-awakening cinematic preview
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=/opt/devkitpro/devkitARM
          export PATH=$DEVKITARM/bin:$DEVKITPRO/tools/bin:$PATH
          make preview-missy-awake
          python3 - <<'PY'
          from pathlib import Path
          rom=Path("bore-missy-awake.gba").read_bytes()
          assert rom[0xA0:0xAA]==b"MISSYAWAKE"
          print(f"Missy awakening preview ROM: PASS ({len(rom)} bytes)")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: bore-missy-awakening-preview
          path: bore-missy-awake.gba
      - name: Biggest users and ROM headroom
        run: |
          export PATH=/opt/devkitpro/devkitARM/bin:$PATH
          first=$(awk '/XP_AT0/{gsub("u","",$3); print $3}' source/packslots.h)
          python3 - "$first" <<'PYX' >> "$GITHUB_STEP_SUMMARY"
          import re, subprocess, sys, os
          first = int(sys.argv[1], 16)
          def run(*a): return subprocess.run(a, capture_output=True, text=True).stdout
          nm = run("arm-none-eabi-nm", "-S", "--size-sort", "-r", "bore.elf").splitlines()
          def top(prefix, n):
              out = []
              for l in nm:
                  p = l.split()
                  if len(p) >= 4 and re.match(prefix, p[0]): out.append("%8d  %s" % (int(p[1], 16), p[3]))
                  if len(out) >= n: break
              return "\n".join(out)
          end = 0
          for l in run("arm-none-eabi-objdump", "-h", "bore.elf").splitlines():
              m = re.match(r"\s*\d+\s+\S+\s+([0-9a-f]+)\s+([0-9a-f]+)\s+([0-9a-f]+)\s", l)
              if m:
                  size, lma = int(m.group(1), 16), int(m.group(3), 16)
                  if 0x08000000 <= lma < first and size: end = max(end, lma + size)
          lim = first - 0x08000000; used = end - 0x08000000
          print("### ROM headroom")
          print("Base game: %d of %d bytes (%.1f%%), **%d bytes free** before the first pack slot." % (used, lim, used * 100.0 / lim, lim - used))
          print("bore.gba %d B, bore-base.gba %d B, bore-creator.gba %d B" % (os.path.getsize("bore.gba"), os.path.getsize("bore-base.gba"), os.path.getsize("bore-creator.gba")))
          for title, pre, n in (("Top EWRAM statics", r"02", 30), ("Top IWRAM statics", r"03", 20), ("Top ROM symbols", r"0[89]", 30)):
              print("### " + title); print("```"); print(top(pre, n)); print("```")
          PYX
      - uses: actions/upload-artifact@v4
        with:
          name: bore-gba
          path: |
            bore.gba
            bore-base.gba
            packs/*.bps
      - uses: actions/upload-artifact@v4
        with:
          name: bore-creator-demo
          path: bore-creator.gba
      - name: Publish the latest build of main as the "Latest build" release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build (${{ github.sha }})
          body: The newest build from main, commit ${{ github.sha }}. bore.gba is the whole game with every expansion pack in - play that one. bore-base.gba is the base game alone, and the BORE-EP*.bps files are the expansion packs one by one; patch them onto bore-base.gba in any order, alone or together (Flips, Rom Patcher JS, ...). Open the ROM in mGBA, Pizza Boy, a PSP emulator or a flash cart.
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: |
            bore.gba
            bore-base.gba
            bore-creator.gba
            packs/*.bps
      - name: Publish release on tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bore.gba
            bore-base.gba
            packs/*.bps

  missy-visual-smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bore-missy-hospital-preview
      - uses: actions/download-artifact@v4
        with:
          name: bore-missy-awakening-preview
      - name: Install mGBA and virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y mgba-qt xvfb xdotool x11-apps imagemagick
      - name: Boot Missy's real hospital cutscene in mGBA
        run: |
          mkdir -p screenshots
          xvfb-run -a -s "-screen 0 1024x768x24" bash -e -c 'bash tools/qa_missy_visual.sh bore-missy-preview.gba hospital && bash tools/qa_missy_visual.sh bore-missy-awake.gba awakening'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: missy-hospital-emulator-screenshots
          path: |
            screenshots/*.png
            screenshots/*emulator.log
          if-no-files-found: error
